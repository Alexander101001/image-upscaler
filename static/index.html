<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Upscaler - Free 4x</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui; background: #1a1a2e; color: #fff; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; }
h1 { text-align: center; margin-bottom: 20px; }
.upload { border: 2px dashed #4ecdc4; border-radius: 15px; padding: 40px; text-align: center; cursor: pointer; }
input[type=file] { display: none; }
.preview { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
.box { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; text-align: center; }
.box img { max-width: 100%; border-radius: 5px; }
button { background: #4ecdc4; color: #000; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px; font-size: 1.1em; }
.status { text-align: center; margin-top: 15px; opacity: 0.8; }
.cta { background: rgba(255,215,0,0.1); border: 1px solid gold; border-radius: 10px; padding: 15px; margin-top: 25px; text-align: center; }
</style>
</head>
<body>
<div class="container">
<h1>🔍 AI Image Upscaler</h1>
<p style="text-align:center;opacity:0.8">Upscale images 4x with AI. 100% in your browser.</p>

<label class="upload" for="fileInput">
📤 Click or Drop Image
<input type="file" id="fileInput" accept="image/*">
</label>

<div class="preview" id="preview" style="display:none">
<div class="box"><div>Original</div><img id="original"></div>
<div class="box"><div>4x Upscaled</div><img id="result" style="display:none"><div id="placeholder">Processing...</div></div>
</div>

<div style="text-align:center">
<button onclick="process()" id="btn" style="display:none">Upscale 4x</button>
<button onclick="download()" id="dl" style="display:none;background:gold">Download HD</button>
</div>

<div class="status" id="status"></div>

<div class="cta">🚀 Want unlimited + batch processing? Pro coming soon — $9/mo</div>
</div>

<script>
let resultData = null;
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const original = document.getElementById('original');
const result = document.getElementById('result');
const placeholder = document.getElementById('placeholder');
const status = document.getElementById('status');
const btn = document.getElementById('btn');
const dl = document.getElementById('dl');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  original.src = URL.createObjectURL(file);
  preview.style.display = 'grid';
  result.style.display = 'none';
  placeholder.style.display = 'block';
  btn.style.display = 'inline-block';
  dl.style.display = 'none';
  resultData = null;
});

async function process() {
  status.textContent = '⏳ Processing (using canvas-based bicubic upscale)...';
  btn.disabled = true;
  
  const img = new Image();
  img.onload = () => {
    // Canvas-based 4x upscale using high-quality interpolation
    const canvas = document.createElement('canvas');
    canvas.width = img.width * 4;
    canvas.height = img.height * 4;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    
    // Multi-step upscale for better quality (2x twice)
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width * 2;
    tempCanvas.height = img.height * 2;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.imageSmoothingEnabled = true;
    tempCtx.imageSmoothingQuality = 'high';
    tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
    
    ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
    
    resultData = canvas.toDataURL('image/png');
    result.src = resultData;
    result.style.display = 'block';
    placeholder.style.display = 'none';
    dl.style.display = 'inline-block';
    status.textContent = `✅ Done! ${img.width}x${img.height} → ${canvas.width}x${canvas.height}`;
    btn.disabled = false;
  };
  img.src = original.src;
}

function download() {
  if (!resultData) return;
  const a = document.createElement('a');
  a.href = resultData;
  a.download = 'upscaled-4x.png';
  a.click();
}
</script>

</html>
